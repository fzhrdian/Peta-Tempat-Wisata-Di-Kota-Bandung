<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Wisata Indonesiaku</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
            border: 5px solid #00060c;
            border-radius: 5px;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="info-panel">
    <strong>Peta Wisata Indonesiaku</strong><br>
    🏝️ Selamat Datang di Peta Wisata Nusantara
</div>

<script>

    // ==========================================
    // 1. INISIALISASI PETA
    // ==========================================
    var map = L.map('map').setView([-6.9146, 107.6098], 13);

    // ==========================================
    // 2. BASEMAP GOOGLE MAPS
    // ==========================================

    // Google Street
    var googleStreet = L.tileLayer(
        'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
        {
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3']
        }
    );

    // Google Satellite
    var googleSatellite = L.tileLayer(
        'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
        {
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3']
        }
    );

    // Google Hybrid
    var googleHybrid = L.tileLayer(
        'https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',
        {
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3']
        }
    );

    // Google Terrain
    var googleTerrain = L.tileLayer(
        'https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
        {
            maxZoom: 20,
            subdomains:['mt0','mt1','mt2','mt3']
        }
    );

    // Basemap default
    googleStreet.addTo(map);

    // ==========================================
    // 3. SCALE BAR
    // ==========================================
    L.control.scale({
        metric: true,
        imperial: false,
        position: 'bottomright'
    }).addTo(map);

    // ==========================================
    // 4. MARKER
    // ==========================================

    var marker = L.marker([-6.9024433884505765, 107.61869474139121]).addTo(map);
    marker.bindPopup('<b>Gedung Sate</b><br>Bandung, Jawa Barat');

    var marker2 = L.marker([-6.9002815473484445, 107.61870295878944]).addTo(map);
    marker2.bindPopup('<b>Taman Gasibu</b><br>Sarana Olahraga Publik');

    var marker3 = L.marker([-6.900108155599629, 107.62595840290041]).addTo(map);
    marker3.bindPopup('<b>Masjid PUSDAI</b><br>Sarana Ibadah Umat Islam');

    var marker4 = L.marker([-6.88984576968767, 107.60678653008878]).addTo(map);
    marker4.bindPopup('<b>Bandung Zoo</b><br>Tempat Wisata Keluarga');

    // ==========================================
    // 5. LAYER CONTROL
    // ==========================================

    var baseMaps = {
        "Google Street": googleStreet,
        "Google Satellite": googleSatellite,
        "Google Hybrid": googleHybrid,
        "Google Terrain": googleTerrain
    };

    var overlayMaps = {
        "Gedung Sate": marker,
        "Taman Gasibu": marker2,
        "Masjid PUSDAI": marker3,
        "Bandung Zoo": marker4
    };

    L.control.layers(baseMaps, overlayMaps).addTo(map);

    console.log('Peta Google Maps berhasil dimuat!');

</script>

</body>
</html>
